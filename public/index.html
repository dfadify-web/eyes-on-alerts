<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyes on Alerts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='8' fill='%23f472b6'/%3E%3Cpath d='M11 20v-5a5 5 0 0 1 10 0v5l1.5 1.5h-13zM14.5 24a1.6 1.6 0 0 0 3 0' fill='none' stroke='%23111' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
  :root { --x: #f472b6; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 14px; align-items: start; }
  @media (max-width: 960px) { .cols { grid-template-columns: 1fr; } }
  .hero { display: flex; align-items: center; gap: 18px; }
  .bellwrap { position: relative; width: 84px; height: 84px; flex: none; display: grid; place-items: center; }
  .bellwrap .tile { width: 64px; height: 64px; border-radius: 20px; }
  .bellwrap .tile svg.i { width: 30px; height: 30px; }
  .bellwrap::before, .bellwrap::after { content: ''; position: absolute; inset: 10px; border-radius: 24px; border: 2px solid var(--x); opacity: 0; animation: wave 2.4s infinite; }
  .bellwrap::after { animation-delay: 1.2s; }
  @keyframes wave { 0% { opacity: .6; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.5); } }
  .ring .tile { animation: shake .7s var(--ease); }
  @keyframes shake { 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(4deg); } }
  .hero h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
  .hero p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .rule { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .rule:last-child { border-bottom: 0; }
  .rule .ri { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }
  .rule b { font-size: 13.5px; } .rule p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }
  .rule input.mins { width: 54px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg-2); text-align: center; font: 12px var(--mono); margin-left: 6px; }
  .push { display: grid; gap: 10px; }
  .push .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .push .row .field { flex: 1; font-family: var(--mono); font-size: 12.5px; }
  .steps { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .steps a { color: var(--x); }
  .steps code { font-family: var(--mono); background: var(--card-2); padding: 1px 6px; border-radius: 5px; color: var(--text); }
  .warnbox { font-size: 11.5px; color: var(--faint); border-left: 2px solid var(--line-2); padding-left: 10px; }
  .feed { display: grid; gap: 8px; }
  .al { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: start; padding: 11px 12px; border-radius: 13px; background: var(--card); border: 1px solid var(--line); animation: drop .5s var(--ease) both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-10px) scale(.98); } }
  .al .ai { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }
  .al b { font-size: 13px; display: block; } .al p { margin: 2px 0 0; font-size: 12px; color: var(--muted); word-break: break-word; }
  .al .m { font: 10.5px var(--mono); color: var(--faint); text-align: right; white-space: nowrap; }
  .al .m .ph { display: inline-flex; gap: 3px; align-items: center; color: var(--ok); }
  .al .m .ph.no { color: var(--err); }
  .al .m svg.i { width: 12px; height: 12px; }
  .stat-row { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="tile" id="logo"></span><div><div class="brand-name">Eyes on Alerts</div><div class="brand-sub">extension · Eyes on Claude</div></div></div>
  <span class="pill" id="conn"></span>
  <div class="grow"></div>
  <button class="btn" id="notifBtn"></button>
  <button class="btn" id="soundBtn"></button>
</header>
<main><div class="wrap">
  <div class="cols">
    <div style="display:grid;gap:14px">
      <section class="card"><div class="hero"><div class="bellwrap" id="bell"><span class="tile" id="bellTile"></span></div><div><h2 id="hTitle"></h2><p id="hText"></p></div></div></section>
      <section class="card"><h3 id="hRules"></h3><div id="rules"></div></section>
      <section class="card push"><h3 id="hPush"><span class="r" id="pushState"></span></h3>
        <div class="row"><span id="pushSwitch"></span><span id="pushLbl" style="font-size:13px;font-weight:600"></span></div>
        <div class="row"><input class="field" id="topic" spellcheck="false"><button class="btn" id="newTopic"></button></div>
        <div class="row"><input class="field" id="server" spellcheck="false"><button class="btn primary" id="test"></button></div>
        <ol class="steps" id="steps"></ol>
        <div class="warnbox" id="warn"></div>
      </section>
    </div>
    <section class="card"><h3 id="hFeed"><span class="r"><button class="btn" id="clear" style="height:26px"></button></span></h3><div class="feed" id="feed"></div></section>
  </div>
</div></main>
<script src="kit.js"></script>
<script>
const { icon, esc, fmtTime, store, connect, LANG } = EOC;
const T = EOC.T({
  es: { title: 'Te aviso cuando Claude te necesite', text: 'Escucha el stream de Eyes on Claude en el servidor, así que avisa aunque esta pestaña esté cerrada.', rules: 'Cuándo avisar', push: 'Push al móvil (ntfy)',
    turnDone: 'Claude ha terminado', turnDoneD: 'Cuando acaba un turno de la sesión principal, con lo que ha tardado.', needsYou: 'Claude te necesita', needsYouD: 'Cuando pide permiso para una herramienta o espera tu respuesta.',
    subagentDone: 'Un subagente ha terminado', subagentDoneD: 'Cada vez que un agente en paralelo acaba su encargo.', toolError: 'Error de una herramienta', toolErrorD: 'Cuando una herramienta falla (como mucho uno cada 20 s por sesión).',
    longTool: 'Herramienta que tarda mucho', longToolD: 'Cuando algo lleva en marcha más de', min: 'min',
    pushOn: 'Enviar avisos al móvil', newTopic: 'Nuevo tema', test: 'Enviar prueba', on: 'activado', off: 'desactivado',
    steps: (topic, server) => [`Instala la app <b>ntfy</b> en el móvil (Android/iOS, gratis).`, `Suscríbete al tema <code>${topic}</code>${server !== 'https://ntfy.sh' ? ` en <code>${server}</code>` : ''}, o abre <a href="${server}/${topic}" target="_blank" rel="noreferrer">${server.replace(/^https?:\/\//, '')}/${topic}</a>.`, 'Activa el interruptor y pulsa «Enviar prueba».'],
    warn: 'Los avisos se envían al servidor de ntfy que indiques; cualquiera que conozca el nombre del tema puede leerlos, por eso se genera uno aleatorio. Incluyen el título de la sesión y un texto corto, nunca código ni archivos.',
    feed: 'Avisos', clear: 'Vaciar', empty: 'Sin avisos todavía. Te avisaré en cuanto pase algo.', notif: 'Notificaciones del navegador', notifOn: 'Notificaciones activadas', sound: 'Sonido', soundOff: 'Sin sonido', test_: 'prueba' },
  en: { title: 'I tell you when Claude needs you', text: 'It listens to the Eyes on Claude stream on the server, so it alerts you even with this tab closed.', rules: 'When to alert', push: 'Push to your phone (ntfy)',
    turnDone: 'Claude finished', turnDoneD: 'When a turn of the main session ends, with how long it took.', needsYou: 'Claude needs you', needsYouD: 'When it asks for permission to use a tool or waits for your answer.',
    subagentDone: 'A subagent finished', subagentDoneD: 'Every time a parallel agent completes its task.', toolError: 'Tool error', toolErrorD: 'When a tool fails (at most one every 20 s per session).',
    longTool: 'Long-running tool', longToolD: 'When something has been running for more than', min: 'min',
    pushOn: 'Send alerts to my phone', newTopic: 'New topic', test: 'Send test', on: 'on', off: 'off',
    steps: (topic, server) => [`Install the free <b>ntfy</b> app on your phone (Android/iOS).`, `Subscribe to the topic <code>${topic}</code>${server !== 'https://ntfy.sh' ? ` on <code>${server}</code>` : ''}, or open <a href="${server}/${topic}" target="_blank" rel="noreferrer">${server.replace(/^https?:\/\//, '')}/${topic}</a>.`, 'Turn the switch on and press “Send test”.'],
    warn: 'Alerts are sent to the ntfy server you set; anyone who knows the topic name can read them, which is why a random one is generated. They carry the session title and a short text, never code or files.',
    feed: 'Alerts', clear: 'Clear', empty: 'No alerts yet. I will let you know as soon as something happens.', notif: 'Browser notifications', notifOn: 'Notifications on', sound: 'Sound', soundOff: 'Muted', test_: 'test' },
});
const RULES = [['turnDone', 'check', 'var(--ok)'], ['needsYou', 'alert', 'var(--run)'], ['subagentDone', 'agent', 'var(--c-agent)'], ['toolError', 'x', 'var(--err)'], ['longTool', 'clock', 'var(--info)']];
const S = { config: null, alerts: [], sound: store.get('eoc.alerts.sound', '1') === '1' };
document.getElementById('logo').innerHTML = icon('bell'); document.getElementById('bellTile').innerHTML = icon('bell');
for (const [id, k] of [['hTitle', 'title'], ['hText', 'text'], ['hRules', 'rules'], ['pushLbl', 'pushOn'], ['newTopic', 'newTopic'], ['test', 'test'], ['warn', 'warn'], ['clear', 'clear']]) document.getElementById(id).textContent = T(k);
document.getElementById('hPush').insertAdjacentText('afterbegin', T('push'));
document.getElementById('hFeed').insertAdjacentText('afterbegin', T('feed'));

const post = (u, b) => fetch(u, { method: 'POST', body: b ? JSON.stringify(b) : undefined }).then((r) => r.json());
async function save(patch) { const r = await post('/api/config', patch); S.config = r.config; renderConfig(); }

function renderConfig() {
  const c = S.config; if (!c) return;
  document.getElementById('rules').innerHTML = RULES.map(([k, ic, col]) => `<div class="rule" style="--c:${col}"><span class="ri">${icon(ic)}</span><div><b>${T(k)}</b><p>${T(k + 'D')}${k === 'longTool' ? `<input class="mins" type="number" min="1" max="240" value="${c.longToolMin}"> ${T('min')}` : ''}</p></div><label class="switch"><input type="checkbox" data-r="${k}" ${c.rules[k] ? 'checked' : ''}><i></i></label></div>`).join('');
  document.querySelectorAll('[data-r]').forEach((x) => (x.onchange = () => save({ rules: { [x.dataset.r]: x.checked } })));
  const mins = document.querySelector('.mins'); if (mins) mins.onchange = () => save({ longToolMin: Number(mins.value) });
  document.getElementById('pushSwitch').innerHTML = `<label class="switch"><input type="checkbox" id="pushOn" ${c.ntfy.enabled ? 'checked' : ''}><i></i></label>`;
  document.getElementById('pushOn').onchange = (e) => save({ ntfy: { enabled: e.target.checked } });
  document.getElementById('pushState').innerHTML = `<span style="color:${c.ntfy.enabled ? 'var(--ok)' : 'var(--faint)'}">● ${T(c.ntfy.enabled ? 'on' : 'off')}</span>`;
  const topic = document.getElementById('topic'), server = document.getElementById('server');
  if (document.activeElement !== topic) topic.value = c.ntfy.topic;
  if (document.activeElement !== server) server.value = c.ntfy.server;
  document.getElementById('steps').innerHTML = T('steps', esc(c.ntfy.topic), esc(c.ntfy.server.replace(/\/+$/, ''))).map((s) => `<li>${s}</li>`).join('');
}
document.getElementById('topic').onchange = (e) => save({ ntfy: { topic: e.target.value.trim().replace(/[^\w-]/g, '') } });
document.getElementById('server').onchange = (e) => save({ ntfy: { server: e.target.value.trim() || 'https://ntfy.sh' } });
document.getElementById('newTopic').onclick = () => save({ ntfy: { topic: 'eyes-on-claude-' + crypto.getRandomValues(new Uint8Array(6)).reduce((a, b) => a + b.toString(16).padStart(2, '0'), '') } });
document.getElementById('test').onclick = () => post('/api/test');
document.getElementById('clear').onclick = async () => { await post('/api/clear'); S.alerts = []; renderFeed(); };

const RICON = Object.fromEntries(RULES.map(([k, i, c]) => [k, [i, c]])); RICON.test = ['bell', 'var(--x)'];
function renderFeed() {
  document.getElementById('feed').innerHTML = S.alerts.length ? S.alerts.map((a) => { const [ic, col] = RICON[a.rule] || ['bell', 'var(--x)']; return `<div class="al" style="--c:${col}"><span class="ai">${icon(ic)}</span><div><b>${esc(a.title)}</b>${a.body ? `<p>${esc(a.body)}</p>` : ''}</div><div class="m">${fmtTime(a.ts)}${a.pushed != null ? `<br><span class="ph ${a.pushed ? '' : 'no'}" data-id="${a.id}">${icon('phone')}${a.pushed ? '✓' : '✗'}</span>` : ''}</div></div>`; }).join('') : `<div class="empty">${T('empty')}</div>`;
}

// Sonido sintetizado (sin archivos): dos notas suaves
let ac;
function chime(rule) {
  if (!S.sound) return;
  try {
    ac = ac || new AudioContext();
    const notes = rule === 'needsYou' ? [880, 660, 880] : rule === 'toolError' ? [330, 262] : [660, 990];
    notes.forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f; const t = ac.currentTime + i * 0.13; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.55); });
  } catch {}
}
function ring() { const b = document.getElementById('bell'); b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring'); }
function notifBtn() {
  const b = document.getElementById('notifBtn'), ok = 'Notification' in window && Notification.permission === 'granted';
  b.innerHTML = `${icon('bell')} ${T(ok ? 'notifOn' : 'notif')}`; b.classList.toggle('on', ok);
  b.onclick = () => 'Notification' in window && Notification.requestPermission().then(notifBtn);
}
function soundBtn() { const b = document.getElementById('soundBtn'); b.innerHTML = `${icon(S.sound ? 'play' : 'pause')} ${T(S.sound ? 'sound' : 'soundOff')}`; b.classList.toggle('on', S.sound); b.onclick = () => { S.sound = !S.sound; store.set('eoc.alerts.sound', S.sound ? '1' : '0'); soundBtn(); if (S.sound) chime('turnDone'); }; }
notifBtn(); soundBtn();

fetch('/api/state').then((r) => r.json()).then((s) => { S.config = s.config; S.alerts = s.alerts; renderConfig(); renderFeed(); });
const es = new EventSource('/api/stream');
es.onmessage = (m) => {
  const d = JSON.parse(m.data);
  if (d.type === 'alert') {
    S.alerts.unshift(d.alert); renderFeed(); ring(); chime(d.alert.rule);
    if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification(d.alert.title, { body: d.alert.body || '', tag: d.alert.rule });
  }
  if (d.type === 'pushed') { const a = S.alerts.find((x) => x.id === d.id); if (a) { a.pushed = d.ok; renderFeed(); } }
};
// Solo para el indicador de conexión con Eyes on Claude
connect({ onEvent: () => {}, pill: document.getElementById('conn') });
</script>
</body>
</html>
